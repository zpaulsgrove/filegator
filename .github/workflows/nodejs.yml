name: Node

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 12/14/16 dropped after the Cypress 3.8.3 → 14 upgrade
        # (Cypress 14's postinstall script uses optional chaining and
        # requires Node >=18). Those Node lines have also been EOL since
        # 2022/2023, so dropping them aligns CI with supported runtimes.
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: npm install, build, and lint
      run: |
        npm install
        npm run lint
