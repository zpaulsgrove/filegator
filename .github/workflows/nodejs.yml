name: Node

# Run on PRs (where review happens) and on master after merge. Triggering on a
# bare `push` as well would double every run while a PR is open (push + the
# pull_request synchronize event both fire on the same commit).
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same PR branch. head_ref is set only for
# pull_request events; pushes fall back to the unique run_id so master runs are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 12/14/16 dropped after the Cypress 3.8.3 → 14 upgrade
        # (Cypress 14's postinstall script uses optional chaining and
        # requires Node >=18). Those Node lines have also been EOL since
        # 2022/2023, so dropping them aligns CI with supported runtimes.
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Lint output is identical across Node versions, so run it only once rather
    # than redundantly on every matrix leg.
    - name: Lint
      if: matrix.node-version == '20.x'
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit
