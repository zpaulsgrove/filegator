name: Mutation

# Mutation testing (Infection) over the security-critical backend services.
# Much slower than the unit suite and the code changes rarely, so it runs on a
# weekly schedule plus on-demand rather than on every push/PR. minMsi/minCoveredMsi
# are 0 in infection.json5, so the job only fails if Infection genuinely cannot run
# (not on a low score) — surfacing real breakage instead of masking it.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  infection:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
      with:
        php-version: '8.3'
        extensions: mbstring, zip, sqlite3, filter
        # pcov is markedly faster than xdebug for line coverage, which matters
        # for the slow initial test run Infection does before mutating.
        coverage: pcov

    - name: Install dependencies
      run: composer install --no-interaction

    - name: Copy configuration.php
      run: cp configuration_sample.php configuration.php

    - name: Run Infection
      # Single-threaded on purpose: the lockout / rate-limit / replay tests share
      # on-disk counter state (app tmpfs + tests/backend/tmp), so parallel workers
      # collide and produce unreliable killed/escaped verdicts. See mutation review.
      # --only-covering-test-cases keeps the run tractable (the feature suite is slow)
      # by running just the tests that cover each mutant rather than whole test files.
      # The JSON report (per-mutant verdicts + MSI summary, for tracking the
      # baseline over time) is configured via logs.json in infection.json5 —
      # Infection 0.29 has no --logger-json CLI flag.
      run: vendor/bin/infection --threads=1 --only-covering-test-cases --logger-github --no-progress

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: infection-report
        path: |
          tests/backend/infection.log
          tests/backend/infection.json
        if-no-files-found: ignore
