name: E2E

on: [push, pull_request]

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: '8.1'
          extensions: mbstring, zip, sqlite3, filter

      - name: Install PHP dependencies
        run: composer install --no-interaction

      # cypress-io/github-action installs npm deps (npm ci from the committed
      # lockfile), caches the Cypress binary, and provides the Linux libs
      # Cypress needs. `command` overrides the default `cypress run` with our
      # orchestrated script: pretest:e2e builds the SPA (so data-test
      # selectors exist in dist), with-e2e-config.js swaps in the seam
      # config, start-server-and-test boots `php -S` and runs specs headless.
      - name: Run E2E suite
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          command: npm run test:e2e

      # Forced admin-MFA-setup runs in isolation: FILEGATOR_E2E_MFA_REQUIRED=1
      # flips mfa_required_for_admins=true in the seam config (config is read
      # per-request by php -S), which would break the single-step admin logins
      # the other specs rely on — so it gets its own server boot and only runs
      # the specs-mfa-required/ specs. Deps + Cypress binary are already
      # installed by the step above, so install: false.
      - name: Run E2E suite (forced MFA setup)
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          install: false
          command: npm run test:e2e:mfa-required
        env:
          FILEGATOR_E2E_MFA_REQUIRED: '1'
